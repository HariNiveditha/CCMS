<!DOCTYPE html>
<html>
<head>
  <title>User Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="user_dashboard.css">
</head>

<body>

<script>
  // 🔐 Protect dashboard
  if (!localStorage.getItem("isLoggedIn")) {
    window.location.href = "login.html";
  }
</script>

<div class="navbar">
  <div><b>Club Portal</b></div>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="clubs.html">Clubs</a>
    <a href="events.html">Events</a>
    <a href="#" onclick="logout()">Logout</a>
  </div>
</div>

<div class="container">

  <h2 id="welcomeText">Welcome 👋</h2>

  <!-- Stats -->
  <div class="stats">
    <div class="card">
      <h3 id="clubCount">0</h3>
      <p>Clubs Joined</p>
    </div>

    <div class="card">
      <h3 id="eventCount">0</h3>
      <p>Events Registered</p>
    </div>
  </div>

  <!-- Events -->
  <div class="section">
    <h3>Upcoming Events</h3>
    <div class="list" id="eventsList"></div>
  </div>

  <!-- Clubs -->
  <div class="section">
    <h3>Your Clubs</h3>
    <div class="list" id="clubsList"></div>
  </div>

</div>

<script src="user_dashboard.js"></script>

</body>
</html>
