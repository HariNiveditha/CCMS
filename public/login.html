<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - CCMS</title>
    <link rel="stylesheet" href="style.css">
    <style>
    .login-box {
        width: 350px;
        margin: 80px auto;
        background: white;
        padding: 25px;
        border-radius: 8px;
        box-shadow: 0px 0px 10px rgba(0,0,0,0.3);
        text-align: left;
    }
    .login-box h2 { text-align: center; }
    #message { color: red; margin-top: 8px; }
    </style>
    <script src="auth.js"></script>
</head>
<body>

<header>
    <div class="logo">CC</div>
    <h1>Login Page</h1>
</header>

<div class="login-box">
    <h2>Login to Club Portal</h2>
    <label>Email</label>
    <input type="email" id="email" placeholder="Enter Email">
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter Password">
    <label>
        <input type="checkbox"> Remember Password
    </label>
    <button onclick="loginUser()">Login</button>
    <p id="message"></p>
</div>

<script>
async function loginUser() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();

    if (!email || !password) {
        alert('Please fill all details');
        return;
    }

    try {
        const response = await fetch('http://localhost:3000/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
            localStorage.setItem('isLoggedIn', 'true');

            const user = data.user || {};
            localStorage.setItem('userId', String(user.id ?? ''));
            localStorage.setItem('userName', String(user.name ?? ''));
            localStorage.setItem('userEmail', String(user.email ?? ''));

            // Clear stale admin state from previous sessions
            localStorage.removeItem('adminClubs');
            localStorage.removeItem('currentClubIndex');

            // Authoritative admin-club check: fetch clubs by user id.
            let rawClubs = Array.isArray(user.adminClubs) ? user.adminClubs : [];
            if (user.id) {
                try {
                    const clubsRes = await fetch(`http://localhost:3000/api/clubs/admin/${user.id}`);
                    const clubsData = await clubsRes.json();
                    if (clubsRes.ok && clubsData.success && Array.isArray(clubsData.data)) {
                        rawClubs = clubsData.data;
                    }
                } catch (_) {
                    // Fall back to login response clubs when clubs endpoint fails.
                }
            }

            const role = rawClubs.length > 0 ? 'admin' : String(user.role ?? 'user').trim().toLowerCase();
            localStorage.setItem('userRole', role);

            if (rawClubs.length > 0) {
                const clubShells = rawClubs.map(c => ({
                    id: c.id,
                    name: c.name,
                    recruitmentOpen: Boolean(c.recruitmentOpen),
                    members: Array.isArray(c.members) ? c.members : [],
                    events: Array.isArray(c.events) ? c.events : []
                }));
                localStorage.setItem('adminClubs', JSON.stringify(clubShells));
            }

            if (window.CCMSAuth && window.CCMSAuth.saveUser) {
                CCMSAuth.saveUser({
                    id: user.id,
                    role: role,
                    name: user.name,
                    email: user.email
                });
            }

            window.location.href = 'index.html';
        } else {
            document.getElementById('message').textContent =
                data.message || `Login failed (status ${response.status}). Please try again.`;
        }
    } catch (error) {
        alert('Could not connect to server. Make sure the backend is running.');
        console.error(error);
    }
}
</script>

</body>
</html>
