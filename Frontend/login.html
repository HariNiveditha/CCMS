<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login — CCMS</title>
    <link rel="stylesheet" href="style.css">
    <style>
    .login-box {
        width: 350px;
        margin: 80px auto;
        background: white;
        padding: 25px;
        border-radius: 8px;
        box-shadow: 0px 0px 10px rgba(0,0,0,0.3);
        text-align: left;
    }
    .login-box h2 { text-align: center; }
    #message { color: red; margin-top: 8px; }
    </style>
</head>
<body>

<header>
    <div class="logo">CC</div>
    <h1>Login Page</h1>
</header>

<div class="login-box">
    <h2>Login to Club Portal</h2>
    <label>Email</label>
    <input type="email" id="email" placeholder="Enter Email">
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter Password">
    <label>
        <input type="checkbox"> Remember Password
    </label>
    <button onclick="loginUser()">Login</button>
    <p id="message"></p>
</div>

<script>
async function loginUser() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();

    if (!email || !password) {
        alert('Please fill all details');
        return;
    }

    try {
        const response = await fetch('http://localhost:3000/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
            // ── Store core auth info ──────────────────────────────────
            localStorage.setItem('isLoggedIn', 'true');

            // Support both flat and nested user objects from backend
            const userName = data.name || data.user?.name || '';
            localStorage.setItem('userName', userName);

            const userEmail = data.email || data.user?.email || email;
            localStorage.setItem('userEmail', userEmail);

            // ── Determine role ────────────────────────────────────────
            // Backend should return data.role = "admin" | "user"
            // Also support data.user.role for nested responses
            const role = data.role || data.user?.role || 'user';
            localStorage.setItem('userRole', role);

            // ── Seed admin club data for dashboard ────────────────────
            // Only write if backend returned adminClubs AND we haven't
            // already stored local club data (avoid overwriting edits).
            const rawClubs = data.adminClubs || data.user?.adminClubs || [];
            if (role === 'admin' && rawClubs.length > 0 && !localStorage.getItem('adminClubs')) {
                const clubShells = rawClubs.map(c => ({
                    id:               c.id,
                    name:             c.name,
                    recruitmentOpen:  c.recruitmentOpen || false,
                    members:          c.members  || [],
                    events:           c.events   || []
                }));
                localStorage.setItem('adminClubs', JSON.stringify(clubShells));
            }

            // ── Redirect ──────────────────────────────────────────────
            // Always go to the main portal; index.html will show the
            // Admin Dashboard card automatically for admin users.
            window.location.href = 'index.html';

        } else {
            document.getElementById('message').textContent =
                data.message || 'Login failed. Please try again.';
        }

    } catch (error) {
        alert('Could not connect to server. Make sure the backend is running.');
        console.error(error);
    }
}
</script>

</body>
</html>
