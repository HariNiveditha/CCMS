<!DOCTYPE html>
<html lang="en">
<head>
    <title>Events - College Club Management</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="events.css">
</head>

<body>

<header>
    <div class="logo">CC</div>
    <h1>College Club Management System</h1>
    <nav>
        <a href="index.html">Home</a> |
        <a href="clubs.html">Clubs</a> |
        <a href="events.html">Events</a> |
        <a href="members.html">Members</a> |
        <a href="contact.html">Contact</a> |
        <span id="authSection"></span>
    </nav>
</header>

<div class="events-wrapper">

    <h2 class="page-title">Events</h2>

    <!-- Filter Bar -->
    <div class="filter-bar">
        <button class="filter-btn active" onclick="filterEvents('all', this)">All</button>
        <button class="filter-btn" onclick="filterEvents('Technical', this)">Technical</button>
        <button class="filter-btn" onclick="filterEvents('Cultural', this)">Cultural</button>
        <button class="filter-btn" onclick="filterEvents('Sports', this)">Sports</button>
    </div>

    <!-- Upcoming Events -->
    <h3 class="section-title">📅 Upcoming Events</h3>
    <div class="events-grid" id="upcomingGrid"></div>

    <!-- Past Events -->
    <h3 class="section-title">🗂️ Past Events</h3>
    <div class="events-grid past" id="pastGrid"></div>

</div>

<footer>
    <p>© 2026 College Club Management System</p>
</footer>

<script>
const events = [
    {
        name: "Web Dev Workshop",
        club: "Coding Club",
        category: "Technical",
        date: "April 10, 2026",
        time: "10:00 AM",
        venue: "Lab Block 3",
        description: "Hands-on workshop covering HTML, CSS and JavaScript basics.",
        seats: 30,
        registered: 18,
        status: "upcoming"
    },
    {
        name: "Robotics Bootcamp",
        club: "Robotics Club",
        category: "Technical",
        date: "April 15, 2026",
        time: "9:00 AM",
        venue: "Engineering Hall",
        description: "Build and program your first robot in a day-long bootcamp.",
        seats: 20,
        registered: 20,
        status: "upcoming"
    },
    {
        name: "Live Jam Session",
        club: "Music Club",
        category: "Cultural",
        date: "April 20, 2026",
        time: "5:00 PM",
        venue: "Open Air Auditorium",
        description: "An evening of live music performances by club members.",
        seats: 100,
        registered: 45,
        status: "upcoming"
    },
    {
        name: "Cricket Tournament",
        club: "Sports Club",
        category: "Sports",
        date: "March 15, 2026",
        time: "8:00 AM",
        venue: "College Ground",
        description: "Inter-department cricket tournament. 8 teams participated.",
        seats: 80,
        registered: 80,
        status: "past"
    },
    {
        name: "Hackathon 2026",
        club: "Coding Club",
        category: "Technical",
        date: "March 5, 2026",
        time: "9:00 AM",
        venue: "Main Auditorium",
        description: "24-hour hackathon with over 15 teams competing for prizes.",
        seats: 60,
        registered: 60,
        status: "past"
    }
];

let currentFilter = 'all';

function renderEvents(filter) {
    const upcomingGrid = document.getElementById('upcomingGrid');
    const pastGrid = document.getElementById('pastGrid');
    upcomingGrid.innerHTML = '';
    pastGrid.innerHTML = '';

    const filtered = filter === 'all' ? events : events.filter(e => e.category === filter);
    const upcoming = filtered.filter(e => e.status === 'upcoming');
    const past = filtered.filter(e => e.status === 'past');

    if (upcoming.length === 0) {
        upcomingGrid.innerHTML = '<p class="no-events">No upcoming events in this category.</p>';
    } else {
        upcoming.forEach(e => upcomingGrid.appendChild(createCard(e)));
    }

    if (past.length === 0) {
        pastGrid.innerHTML = '<p class="no-events">No past events in this category.</p>';
    } else {
        past.forEach(e => pastGrid.appendChild(createCard(e)));
    }
}

function createCard(e) {
    const isFull = e.registered >= e.seats;
    const seatsLeft = e.seats - e.registered;
    const isPast = e.status === 'past';

    const card = document.createElement('div');
    card.className = 'event-card' + (isPast ? ' past-card' : '');

    card.innerHTML = `
        <div class="event-category-tag">${e.category}</div>
        <div class="event-name">${e.name}</div>
        <div class="event-club">🏛️ ${e.club}</div>
        <div class="event-meta">
            <span>📅 ${e.date}</span>
            <span>🕐 ${e.time}</span>
            <span>📍 ${e.venue}</span>
        </div>
        <p class="event-desc">${e.description}</p>
        <div class="seats-bar">
            <div class="seats-fill" style="width:${(e.registered/e.seats)*100}%"></div>
        </div>
        <div class="seats-text">${isPast ? `${e.registered} attended` : isFull ? 'Seats Full' : `${seatsLeft} seats left`}</div>
        ${isPast
            ? `<button class="btn-past" disabled>Event Completed</button>`
            : isFull
                ? `<button class="btn-full" disabled>Fully Booked</button>`
                : `<button class="btn-register" onclick="register('${e.name}')">Register Now</button>`
        }
    `;
    return card;
}

function filterEvents(category, btn) {
    currentFilter = category;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderEvents(category);
}

function register(eventName) {
    const isLoggedIn = localStorage.getItem('isLoggedIn');
    if (!isLoggedIn) {
        alert('Please login first to register for events.');
        window.location.href = 'login.html';
        return;
    }
    alert(`Successfully registered for ${eventName}!`);
}

// Auth nav
const authSection = document.getElementById('authSection');
if (localStorage.getItem('isLoggedIn')) {
    authSection.innerHTML = `<a href="user_dashboard.html">Dashboard</a> | <a href="#" onclick="logout()">Logout</a>`;
} else {
    authSection.innerHTML = `<a href="login.html">Login</a> <a href="signup.html">Sign Up</a>`;
}

function logout() {
    localStorage.clear();
    window.location.href = 'index.html';
}

renderEvents('all');
</script>

</body>
</html>
