<!DOCTYPE html>
<html>
<head>
    <title>Clubs</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="clubs.css">
</head>

<body>

<h1>Clubs</h1>

<div class="clubs-container" id="clubsContainer">
    <p id="loadingMsg">Loading clubs...</p>
</div>

<script>

const API = 'http://localhost:3000/api';

// Fetch clubs from backend
async function loadClubs() {
    try {
        const res = await fetch(`${API}/clubs`);
        const data = await res.json();

        const container = document.getElementById('clubsContainer');
        document.getElementById('loadingMsg')?.remove();

        if (!data.success || data.data.length === 0) {
            container.innerHTML = '<p>No clubs found.</p>';
            return;
        }

        data.data.forEach(club => {
            const card = document.createElement('div');
            card.className = 'club-card';

            card.innerHTML = `
                <div class="club-title">${club.name}</div>
                <div class="about">${club.description || 'No description available.'}</div>
                <button class="apply-btn" onclick="applyClub('${club.name}')">Apply Now</button>
            `;

            container.appendChild(card);
        });

    } catch (err) {
        document.getElementById('clubsContainer').innerHTML = '<p>Could not load clubs. Make sure the server is running.</p>';
        console.error(err);
    }
}

// Apply Function
function applyClub(clubName) {
    const user = localStorage.getItem('user');
    if (!user) {
        alert('Please login first');
        window.location.href = 'login.html';
        return;
    }
    alert('Application submitted for ' + clubName);
}

loadClubs();

</script>

</body>
</html>
