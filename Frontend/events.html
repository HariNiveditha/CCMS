<!DOCTYPE html>
<html lang="en">
<head>
    <title>Events - College Club Management</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="events.css">
</head>

<body>

<header>
    <div class="logo">CC</div>
    <h1>College Club Management System</h1>
    <nav>
        <a href="index.html">Home</a> |
        <a href="clubs.html">Clubs</a> |
        <a href="events.html">Events</a> |
        <a href="members.html">Members</a> |
        <a href="contact.html">Contact</a> |
        <span id="authSection"></span>
    </nav>
</header>

<div class="events-wrapper">

    <h2 class="page-title">Events</h2>

    <!-- Filter Bar -->
    <div class="filter-bar">
        <button class="filter-btn active" onclick="filterEvents('all', this)">All</button>
        <button class="filter-btn" onclick="filterEvents('Technical', this)">Technical</button>
        <button class="filter-btn" onclick="filterEvents('Cultural', this)">Cultural</button>
        <button class="filter-btn" onclick="filterEvents('Sports', this)">Sports</button>
    </div>

    <!-- Upcoming Events -->
    <h3 class="section-title">📅 Upcoming Events</h3>
    <div class="events-grid" id="upcomingGrid"><p>Loading...</p></div>

    <!-- Past Events -->
    <h3 class="section-title">🗂️ Past Events</h3>
    <div class="events-grid past" id="pastGrid"><p>Loading...</p></div>

</div>

<footer>
    <p>© 2026 College Club Management System</p>
</footer>

<script>

const API = 'http://localhost:3000/api';
let allEvents = [];
let currentFilter = 'all';

// Fetch events from backend
async function loadEvents() {
    try {
        const res = await fetch(`${API}/events`);
        const data = await res.json();

        if (!data.success) {
            showError();
            return;
        }

        // Determine upcoming vs past based on date
        const now = new Date();
        allEvents = data.data.map(e => ({
            ...e,
            status: new Date(e.date) >= now ? 'upcoming' : 'past'
        }));

        renderEvents(currentFilter);

    } catch (err) {
        showError();
        console.error(err);
    }
}

function showError() {
    document.getElementById('upcomingGrid').innerHTML = '<p>Could not load events. Make sure the server is running.</p>';
    document.getElementById('pastGrid').innerHTML = '';
}

function renderEvents(filter) {
    const upcomingGrid = document.getElementById('upcomingGrid');
    const pastGrid = document.getElementById('pastGrid');
    upcomingGrid.innerHTML = '';
    pastGrid.innerHTML = '';

    const filtered = filter === 'all' ? allEvents : allEvents.filter(e => e.category === filter);
    const upcoming = filtered.filter(e => e.status === 'upcoming');
    const past = filtered.filter(e => e.status === 'past');

    if (upcoming.length === 0) {
        upcomingGrid.innerHTML = '<p class="no-events">No upcoming events.</p>';
    } else {
        upcoming.forEach(e => upcomingGrid.appendChild(createCard(e)));
    }

    if (past.length === 0) {
        pastGrid.innerHTML = '<p class="no-events">No past events.</p>';
    } else {
        past.forEach(e => pastGrid.appendChild(createCard(e)));
    }
}

function createCard(e) {
    const isPast = e.status === 'past';
    const eventDate = new Date(e.date);
    const dateStr = eventDate.toLocaleDateString('en-IN', { year: 'numeric', month: 'long', day: 'numeric' });
    const timeStr = eventDate.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });

    // Check if user is already registered (from localStorage)
    const registeredEvents = JSON.parse(localStorage.getItem('registeredEvents') || '[]');
    const isRegistered = registeredEvents.includes(e.id);

    const card = document.createElement('div');
    card.className = 'event-card' + (isPast ? ' past-card' : '');

    card.innerHTML = `
        <div class="event-name">${e.title}</div>
        <div class="event-club">🏛️ ${e.club_name || 'General'}</div>
        <div class="event-meta">
            <span>📅 ${dateStr}</span>
            <span>🕐 ${timeStr}</span>
            <span>📍 ${e.location || 'TBD'}</span>
        </div>
        <p class="event-desc">${e.description || ''}</p>
        ${isPast
            ? `<button class="btn-past" disabled>Event Completed</button>`
            : isRegistered
            ? `<button class="btn-past" disabled>✓ Already Registered</button>`
            : `<button class="btn-register" onclick="register(${e.id})">Register Now</button>`
        }
    `;
    return card;
}

function filterEvents(category, btn) {
    currentFilter = category;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderEvents(category);
}

function register(eventId) {
    const isLoggedIn = localStorage.getItem('isLoggedIn');
    if (!isLoggedIn) {
        alert('Please login first to register for events.');
        window.location.href = 'login.html';
        return;
    }
    window.location.href = `event-registration.html?eventId=${eventId}`;
}

// Auth nav
const authSection = document.getElementById('authSection');
if (localStorage.getItem('isLoggedIn')) {
    authSection.innerHTML = `<a href="user_dashboard.html">Dashboard</a> | <a href="#" onclick="logout()">Logout</a>`;
} else {
    authSection.innerHTML = `<a href="login.html">Login</a> <a href="signup.html">Sign Up</a>`;
}

function logout() {
    localStorage.clear();
    window.location.href = 'index.html';
}

loadEvents();
</script>

</body>
</html>
