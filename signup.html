<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sign Up</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <style>
        .signup-container {
            width: 350px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
            text-align: left;
        }
 
        .signup-container h2 {
            text-align: center;
        }
    </style>
</head>

<body>

<header>
    <h1>College Club Management System</h1>
</header>

<div class="signup-container">

<h2>Create Account</h2>

<form>

<label>Roll Number</label>
<input type="text" required>

<label>Name</label>
<input type="text" required>

<label>Email</label>
<input type="email" required>

<label>Phone</label>
<input type="tel" required>

<label>Password</label>
<input type="password" required>

<div class="remember">
<input type="checkbox" id="remember">
<label for="remember">Remember Me</label>
</div>

<button type="button" onclick="signupUser()">Sign Up</button>

</form>

</div>
<script>
function signupUser() {
  // after successful signing up
  localStorage.setItem("isLoggedIn", "true"); // store login state

  window.location.href = "user_dashboard.html"; // redirect
}
</script>
</body>
</html>
