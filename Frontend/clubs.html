<!DOCTYPE html>
<html>
<head>
    <title>Clubs</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="clubs.css">
</head>

<body>

<h1>Clubs</h1>

<div class="clubs-container" id="clubsContainer">
    <p id="loadingMsg">Loading clubs...</p>
</div>

<script>

const API = 'http://localhost:3000/api';

// Fetch clubs from backend
async function loadClubs() {
    try {
        const res = await fetch(`${API}/clubs`);
        const data = await res.json();

        const container = document.getElementById('clubsContainer');
        document.getElementById('loadingMsg')?.remove();

        if (!data.success || data.data.length === 0) {
            container.innerHTML = '<p>No clubs found.</p>';
            return;
        }

        const userEmail = localStorage.getItem('userEmail');

        data.data.forEach(club => {
            const card = document.createElement('div');
            card.className = 'club-card';

            let actionButton = '';
            if (club.recruitmentOpen) {
                actionButton = `<button class="apply-btn" onclick="applyClub(${club.id}, '${club.name}', '${userEmail}')">Apply Now</button>`;
            } else {
                actionButton = `<button class="apply-btn" style="background: #999; cursor: not-allowed;" disabled>Recruitment Closed</button>`;
            }

            card.innerHTML = `
                <div class="club-title">${club.name}</div>
                <div class="about">${club.description || 'No description available.'}</div>
                <div style="font-size: 12px; color: #666; margin-bottom: 10px;">
                    ${club.recruitmentOpen ? '🟢 Recruitment Open' : '🔴 Recruitment Closed'}
                </div>
                ${actionButton}
            `;

            container.appendChild(card);
        });

    } catch (err) {
        document.getElementById('clubsContainer').innerHTML = '<p>Could not load clubs. Make sure the server is running.</p>';
        console.error(err);
    }
}

// Apply Function
async function applyClub(clubId, clubName, userEmail) {
    // Check if user is logged in
    if (!localStorage.getItem('isLoggedIn')) {
        alert('Please login first');
        window.location.href = 'login.html';
        return;
    }

    if (!userEmail) {
        alert('Please login again to apply');
        window.location.href = 'login.html';
        return;
    }

    try {
        const response = await fetch(`${API}/clubs/${clubId}/join`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: userEmail })
        });

        const data = await response.json();

        if (response.ok) {
            alert('✅ ' + data.message);
            location.reload(); // Reload to show updated status
        } else {
            alert('❌ ' + data.message);
        }
    } catch (err) {
        alert('Error submitting application');
        console.error(err);
    }
}

loadClubs();

</script>

</body>
</html>
