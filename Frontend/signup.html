<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sign Up</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <script src="auth.js"></script>
    <style>
        .signup-container {
            width: 350px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
            text-align: left;
        }
 
        .signup-container h2 {
            text-align: center;
        }
    </style>
</head>

<body>

<header>
    <h1>College Club Management System</h1>
</header>

<div class="signup-container">

<h2>Create Account</h2>

<form id="signupForm">

<label>Name <span style="color:red;">*</span></label>
<input type="text" id="name" placeholder="Enter your full name" required>

<label>Email <span style="color:red;">*</span></label>
<input type="email" id="email" placeholder="Enter your email" required>

<label>Branch <span style="color:red;">*</span></label>
<select id="branch" required>
  <option value="">Select Your Branch</option>
  <option value="Computer Science">Computer Science</option>
  <option value="Electronics">Electronics</option>
  <option value="Mechanical">Mechanical</option>
  <option value="Electrical">Electrical</option>
  <option value="Civil">Civil</option>
</select>

<label>Academic Year <span style="color:red;">*</span></label>
<select id="year" required>
  <option value="">Select Your Year</option>
  <option value="1st Year">1st Year</option>
  <option value="2nd Year">2nd Year</option>
  <option value="3rd Year">3rd Year</option>
  <option value="4th Year">4th Year</option>
</select>

<label>Password <span style="color:red;">*</span></label>
<input type="password" id="password" placeholder="Enter password" required>

<label>Confirm Password <span style="color:red;">*</span></label>
<input type="password" id="confirmPassword" placeholder="Confirm password" required>

<button type="button" onclick="signupUser()" style="width: 100%; padding: 12px; background: #164777; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Create Account</button>

<p style="text-align: center; margin-top: 15px;">
  Already have an account? <a href="login.html" style="color: #164777; font-weight: bold;">Login here</a>
</p>

<div id="errorMsg" style="color: red; margin-top: 10px; display:none;"></div>

</form>

</div>
<script>
async function signupUser() {
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const branch = document.getElementById('branch').value;
  const year = document.getElementById('year').value;
  const password = document.getElementById('password').value.trim();
  const confirmPassword = document.getElementById('confirmPassword').value.trim();
  const errorMsg = document.getElementById('errorMsg');

  // Validation
  if (!name || !email || !branch || !year || !password || !confirmPassword) {
    errorMsg.textContent = '❌ Please fill in all required fields';
    errorMsg.style.display = 'block';
    return;
  }

  if (password !== confirmPassword) {
    errorMsg.textContent = '❌ Passwords do not match';
    errorMsg.style.display = 'block';
    return;
  }

  if (password.length < 6) {
    errorMsg.textContent = '❌ Password must be at least 6 characters';
    errorMsg.style.display = 'block';
    return;
  }

  try {
    const response = await fetch('http://localhost:3000/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name,
        email,
        password,
        branch,
        year,
        role: 'student'
      })
    });

    const data = await response.json();

    if (response.ok && data.success) {
      // Save to localStorage
      localStorage.setItem('isLoggedIn', 'true');
      localStorage.setItem('userId', String(data.userId || ''));
      localStorage.setItem('userName', name);
      localStorage.setItem('userEmail', email);
      localStorage.setItem('userRole', 'student');
      
      // Save via CCMSAuth if available
      if (window.CCMSAuth && CCMSAuth.saveUser) {
        CCMSAuth.saveUser({
          id: data.userId,
          role: 'student',
          name: name,
          email: email
        });
      }

      // Redirect to profile setup page (Phase 2)
      alert('✅ Account created successfully! Now let\'s complete your profile.');
      window.location.href = 'user_profile_setup.html';
      
    } else {
      errorMsg.textContent = '❌ ' + (data.message || 'Signup failed. Try again.');
      errorMsg.style.display = 'block';
    }

  } catch (error) {
    console.error('Signup error:', error);
    errorMsg.textContent = '❌ Connection error. Please try again.';
    errorMsg.style.display = 'block';
  }
}
</script>

      alert(data.message); // show error e.g. "Email already exists"

    alert('Could not connect to server. Make sure it is running.');

}
</script>

</body>
</html>
