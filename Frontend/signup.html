<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sign Up</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <style>
        .signup-container {
            width: 350px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
            text-align: left;
        }
 
        .signup-container h2 {
            text-align: center;
        }
    </style>
</head>

<body>

<header>
    <h1>College Club Management System</h1>
</header>

<div class="signup-container">

<h2>Create Account</h2>

<form>

<label>Roll Number</label>
<input type="text" id="roll_number" required>

<label>Name</label>
<input type="text" id="name" required>

<label>Email</label>
<input type="email" id="email" required>

<label>Phone</label>
<input type="tel" id="phone" required>

<label>Password</label>
<input type="password" id="password" required>

<div class="remember">
<input type="checkbox" id="remember">
<label for="remember">Remember Me</label>
</div>

<button type="button" onclick="signupUser()">Sign Up</button>

</form>

</div>
<script>
async function signupUser() {
  const roll_number = document.getElementById('roll_number').value.trim();
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const password = document.getElementById('password').value.trim();

  if (!roll_number || !name || !email || !phone || !password) {
    alert('Please fill in all fields');
    return;
  }

  try {
    const response = await fetch('http://localhost:3000/api/auth/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ roll_number, name, email, phone, password })
    });

    const data = await response.json();

    if (response.ok) {
      localStorage.setItem('isLoggedIn', 'true');
      window.location.href = 'user_dashboard.html';
    } else {
      alert(data.message); // show error e.g. "Email already exists"
    }
  } catch (error) {
    alert('Could not connect to server. Make sure it is running.');
  }
}
</script>

</body>
</html>
